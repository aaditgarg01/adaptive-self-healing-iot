[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = beegee-tokyo/DHT sensor library for ESPx@1.19.0
build_flags = -Wall -Wextra


; Stage 2: separate simulator instances, stable identities, serial only.
[env:node2]
extends = env:esp32dev
build_flags = -DNODE_ID_VALUE=\"N02\"

[env:node3]
extends = env:esp32dev
build_flags = -DNODE_ID_VALUE=\"N03\"

; Stages 3–4: optional local MQTT and controlled fault modes.
[env:demo]
extends = env:esp32dev
lib_deps =
    ${env:esp32dev.lib_deps}
    knolleary/PubSubClient@2.8
build_flags = -DIOT_DEMO

[env:demo2]
extends = env:demo
build_flags = -DIOT_DEMO -DNODE_ID_VALUE=\"N02\"

[env:demo3]
extends = env:demo
build_flags = -DIOT_DEMO -DNODE_ID_VALUE=\"N03\"
